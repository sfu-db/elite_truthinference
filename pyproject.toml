[project]
name = "qrank"
version = "0.1.0"
description = "qrank"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "anyio>=4.9.0",
    "datasets>=4.2.0",
    "httpx>=0.28.1",
    "joblib>=1.5.0",
    "llama-index-core>=0.14.22",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "peft>=0.19.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.0",
    "sentence-transformers>=4.0.0",
    "sqlalchemy>=2.0.42",
    "sqlglot>=23.12.1",
    "sqlparse>=0.6.0",
    "torch==2.7.1",
    "tqdm>=4.67.0",
    "transformers>=4.57.6",
    "wandb>=0.26.1",
]

[project.scripts]
qrank-qcsaem = "qrank.weak_models.cli:main"
qrank-two-view = "qrank.two_view.cli:main"

[dependency-groups]
dev = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "openai>=2.34.0",
  "pytest>=8.0.0",
  "seaborn>=0.13.2",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
