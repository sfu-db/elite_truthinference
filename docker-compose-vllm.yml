services:
  vllm-deployment:
    image: vllm/vllm-openai:v0.22.1-cu129
    # vllm/vllm-v0.10.0-cuda12.8
    # vllm/vllm-openai:v0.10.0
    # vllm-gpu-image:cuda12.2
    container_name: vllm-inference
    restart: always
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: "host"
    shm_size: '8gb'
    environment:
      NCCL_P2P_DISABLE: "1"
      NCCL_SHM_DISABLE: "1"     # only if the above alone doesn't fix it
      NCCL_DEBUG: "INFO"        # turn this on to see what NCCL is actually doing      
      NVIDIA_VISIBLE_DEVICES: "0,1"
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      MODEL_NAME: ${LLM_MODEL}
    ports:
      # <Port exposed> : <VLLM Port running inside container>
      - '8081:8000'
    expose:
      - '8089'
    networks:
      - shared_network
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./chat_template.jinja:/chat_template.jinja
    command: >
      --model ${LLM_MODEL} 
      --gpu-memory-utilization 0.95 
      --port 8000 
      --tensor-parallel-size 2  
      --max-num-seqs 16  
      --max-model-len 16384
      --dtype bfloat16
      --trust-remote-code
      --reasoning-parser qwen3
    
    # --tokenizer_mode mistral
    # --config_format mistral
    # --load_format mistral
    # --enable-auto-tool-choice
    # --tool-call-parser mistral
    # --quantization None
      
      
    # --chat-template /chat_template.jinja
    # --task generate 

    # --max-model-len 16384  --enable-chunked-prefill
    
    #  --chat-template /chat_template.jinja
    
    # --max_model_len 33768    
    # --max_model_len 33768
    # --max_model_len 33768
    ## If the model does not provide chat template, use the parameter --chat-template /chat_template.jinja
    ## IF the model is 8B use the following parameters
    # --max-num-seqs 196 
    # --chat-template /chat_template.jinja
    # command: --model ${MODEL_NAME} --enable-chunked-prefill --gpu_memory_utilization 0.95 --dtype float16 --port 8000 --tensor-parallel-size 2 --chat-template /chat_template.jinja  --max_model_len 28028
    # --max_model_len 28028
networks:
  shared_network:
    name: shared_network
